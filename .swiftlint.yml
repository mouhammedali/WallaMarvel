# SwiftLint Configuration for WallaMarvel

included:
  - WallaMarvel
  - WallaMarvelTests
  - WallaMarvelUITests

excluded:
  - WallaMarvel.xcodeproj
  - DerivedData
  - .build

# Rules
disabled_rules:
  - trailing_comma           # Allow trailing commas in collections
  - todo                     # Allow TODO/FIXME comments during development

opt_in_rules:
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_first_not_nil
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - fatal_error_message
  - first_where
  # force_unwrapping and implicitly_unwrapped_optional intentionally not enabled:
  # They trigger on standard XCTest setUp/tearDown patterns (IUOs) and test assertions (force unwrap).
  - last_where
  - legacy_multiple
  - modifier_order
  - overridden_super_call
  - prefer_self_in_static_references
  - prefer_zero_over_explicit_init
  - private_action
  - private_outlet
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_whitespace_closing_braces

# Rule Configuration
line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 500
  error: 800

function_body_length:
  warning: 60
  error: 100

function_parameter_count:
  warning: 6
  error: 8

type_name:
  min_length: 3
  max_length: 50

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 60
  excluded:
    - id
    - to
    - x
    - y
    - i

nesting:
  type_level: 3
  function_level: 3

reporter: "xcode"
